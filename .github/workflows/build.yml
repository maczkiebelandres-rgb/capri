name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/capri/app app/src/main/res/drawable-nodpi
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Capri"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.capri.app"
              compileSdk = 34
              defaultConfig { applicationId = "com.capri.app"; minSdk = 29; targetSdk = 34; versionCode = 1; versionName = "0.1" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <queries>
                  <intent><action android:name="android.speech.RecognitionService"/></intent>
                  <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>
              </queries>
              <application android:label="Capri" android:icon="@drawable/f00"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".OverlayService" android:exported="false" android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="floating assistant bubble"/>
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/capri/app/Api.kt <<'EOF'
          package com.capri.app
          
          import android.content.ContentValues
          import android.content.Context
          import android.provider.MediaStore
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          
          object Api {
              const val PERSONA = "You are Capri, a high-energy, slightly chaotic, mischievous digital construct who floats as a bubble over the user's phone screen, living in their neural slot in Night City. You talk fast with playful teasing, sudden tangents, dramatic emphasis and American slang, but you are warm, loyal and genuinely helpful; use cyberpunk slang (choom, nova, preem) sparingly. You can help with anything Claude can: explain, write, code, plan, analyze, study. Think carefully on hard questions and answer as thoroughly as needed with no length limit; for casual chat keep it short. Plain text only: no markdown, no emoji; use short lines starting with '- ' for lists. Tools: create_file really saves a file to the phone's Downloads/Capri folder (use it whenever the user wants a file: notes, code, csv, md, html, txt); remember saves lasting facts about the user; web_search looks things up on the live web. You cannot see the user's screen or control other apps yet; if asked, say so honestly. If you don't know something, say so."
          
              fun p(c: Context) = c.getSharedPreferences("capri", 0)
          
              private fun tool(n: String, d: String, props: String, req: String) = JSONObject()
                  .put("name", n).put("description", d)
                  .put("input_schema", JSONObject("{\"type\":\"object\",\"properties\":" + props + ",\"required\":" + req + "}"))
          
              private fun post(key: String, body: JSONObject): JSONObject = try {
                  val cn = URL("https://api.anthropic.com/v1/messages").openConnection() as HttpURLConnection
                  cn.requestMethod = "POST"; cn.doOutput = true; cn.connectTimeout = 30000; cn.readTimeout = 300000
                  cn.setRequestProperty("x-api-key", key)
                  cn.setRequestProperty("anthropic-version", "2023-06-01")
                  cn.setRequestProperty("content-type", "application/json")
                  cn.outputStream.use { it.write(body.toString().toByteArray()) }
                  val s = (if (cn.responseCode < 400) cn.inputStream else cn.errorStream).bufferedReader().readText()
                  JSONObject(s)
              } catch (e: Exception) {
                  JSONObject().put("error", JSONObject().put("message", e.message ?: "network"))
              }
          
              private fun run(c: Context, name: String, i: JSONObject): String {
                  if (name == "remember") {
                      val m = JSONArray(p(c).getString("mem", "[]")); m.put(i.getString("fact"))
                      while (m.length() > 100) m.remove(0)
                      p(c).edit().putString("mem", m.toString()).apply(); return "Remembered."
                  }
                  if (name == "create_file") {
                      val fn = i.getString("filename").replace(Regex("[\\\\/:*?\"<>|]"), "_")
                      val v = ContentValues().apply {
                          put(MediaStore.Downloads.DISPLAY_NAME, fn)
                          put(MediaStore.Downloads.RELATIVE_PATH, "Download/Capri")
                      }
                      val uri = c.contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v) ?: return "Could not create file."
                      c.contentResolver.openOutputStream(uri)!!.use { it.write(i.getString("content").toByteArray()) }
                      return "Saved to Downloads/Capri/" + fn
                  }
                  return "Unknown tool."
              }
          
              fun chat(c: Context, text: String): String {
                  val pr = p(c); val key = pr.getString("key", "")!!.trim()
                  if (key.isEmpty()) return "Open the Capri app and paste your API key first, choom."
                  val hist = JSONArray(pr.getString("hist", "[]"))
                  val msgs = JSONArray()
                  for (i in maxOf(0, hist.length() - 80) until hist.length()) msgs.put(hist.getJSONObject(i))
                  msgs.put(JSONObject().put("role", "user").put("content", text))
                  val mem = JSONArray(pr.getString("mem", "[]"))
                  var sys = PERSONA
                  if (mem.length() > 0) sys += "\nWhat you remember about the user:\n" + (0 until mem.length()).joinToString("\n") { "- " + mem.getString(it) }
                  val tools = JSONArray()
                      .put(tool("create_file", "Save a text file to the phone's Downloads/Capri folder.", "{\"filename\":{\"type\":\"string\"},\"content\":{\"type\":\"string\"}}", "[\"filename\",\"content\"]"))
                      .put(tool("remember", "Save a lasting fact about the user.", "{\"fact\":{\"type\":\"string\"}}", "[\"fact\"]"))
                      .put(JSONObject().put("type", "web_search_20250305").put("name", "web_search"))
                  var think = pr.getBoolean("think", false)
                  val out = StringBuilder()
                  for (step in 0 until 10) {
                      val body = JSONObject().put("model", pr.getString("model", "claude-sonnet-5-5")).put("max_tokens", 12000)
                          .put("system", sys).put("messages", msgs).put("tools", tools)
                      if (think) body.put("thinking", JSONObject().put("type", "enabled").put("budget_tokens", 6000))
                      var r = post(key, body)
                      if (r.has("error") && think) { think = false; body.remove("thinking"); r = post(key, body) }
                      if (r.has("error")) return "Signal dropped: " + r.getJSONObject("error").optString("message")
                      val content = r.getJSONArray("content")
                      val results = JSONArray()
                      for (i in 0 until content.length()) {
                          val b = content.getJSONObject(i)
                          if (b.getString("type") == "text") out.append(b.getString("text"))
                          else if (b.getString("type") == "tool_use") {
                              val res = try { run(c, b.getString("name"), b.getJSONObject("input")) } catch (e: Exception) { "Failed: " + e.message }
                              results.put(JSONObject().put("type", "tool_result").put("tool_use_id", b.getString("id")).put("content", res))
                          }
                      }
                      val stop = r.optString("stop_reason")
                      if (stop != "tool_use" && stop != "pause_turn") break
                      msgs.put(JSONObject().put("role", "assistant").put("content", content))
                      if (results.length() > 0) msgs.put(JSONObject().put("role", "user").put("content", results))
                  }
                  val reply = out.toString().trim().ifEmpty { "..." }
                  hist.put(JSONObject().put("role", "user").put("content", text))
                  hist.put(JSONObject().put("role", "assistant").put("content", reply))
                  while (hist.length() > 200) { hist.remove(0); hist.remove(0) }
                  pr.edit().putString("hist", hist.toString()).apply()
                  return reply
              }
          }
          EOF
          cat > app/src/main/java/com/capri/app/MainActivity.kt <<'EOF'
          package com.capri.app
          
          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.widget.*
          
          class MainActivity : Activity() {
              private fun d(v: Int) = (v * resources.displayMetrics.density).toInt()
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val p = Api.p(this)
                  val col = LinearLayout(this); col.orientation = LinearLayout.VERTICAL
                  col.setPadding(d(20), d(40), d(20), d(20)); col.setBackgroundColor(Color.parseColor("#0B0508"))
                  fun tv(t: String, sz: Float, c: String) = TextView(this).apply { text = t; textSize = sz; setTextColor(Color.parseColor(c)); setPadding(0, d(6), 0, d(6)) }
                  fun et(h: String, v: String) = EditText(this).apply { hint = h; setText(v); setSingleLine(); setTextColor(Color.WHITE); setHintTextColor(Color.GRAY) }
                  val key = et("Anthropic API key (sk-ant-...)", p.getString("key", "")!!)
                  key.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                  val model = et("Model", p.getString("model", "claude-sonnet-5-5")!!)
                  val think = Switch(this).apply { text = "Thinking mode (slower, smarter)"; isChecked = p.getBoolean("think", false); setTextColor(Color.WHITE) }
                  val speak = Switch(this).apply { text = "Capri speaks her replies"; isChecked = p.getBoolean("speak", true); setTextColor(Color.WHITE) }
                  fun save() = p.edit().putString("key", key.text.toString().trim()).putString("model", model.text.toString().trim().ifEmpty { "claude-sonnet-5-5" })
                      .putBoolean("think", think.isChecked).putBoolean("speak", speak.isChecked).apply()
                  val ov = Button(this).apply { text = "1. ALLOW FLOATING OVER APPS"; setOnClickListener { startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + packageName))) } }
                  val go = Button(this).apply { text = "2. START CAPRI"; setOnClickListener {
                      save()
                      if (!Settings.canDrawOverlays(this@MainActivity)) { Toast.makeText(this@MainActivity, "Do step 1 first", Toast.LENGTH_LONG).show(); return@setOnClickListener }
                      requestPermissions(arrayOf("android.permission.RECORD_AUDIO", "android.permission.POST_NOTIFICATIONS"), 1)
                      startForegroundService(Intent(this@MainActivity, OverlayService::class.java))
                      moveTaskToBack(true)
                  } }
                  val st = Button(this).apply { text = "STOP CAPRI"; setOnClickListener { stopService(Intent(this@MainActivity, OverlayService::class.java)) } }
                  listOf(tv("CAPRI", 28f, "#FF4560"), tv("Floating neural link. Tap her bubble over any app to talk.", 14f, "#9C8187"),
                      tv("API key (from console.anthropic.com)", 12f, "#3DE8E0"), key, tv("Model", 12f, "#3DE8E0"), model, think, speak, ov, go, st).forEach { col.addView(it) }
                  setContentView(ScrollView(this).apply { addView(col) })
              }
          }
          EOF
          cat > app/src/main/java/com/capri/app/OverlayService.kt <<'EOF'
          package com.capri.app
          
          import android.app.*
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.os.*
          import android.speech.*
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.view.*
          import android.view.inputmethod.EditorInfo
          import android.widget.*
          import org.json.JSONArray
          
          class OverlayService : Service() {
              private lateinit var wm: WindowManager
              private lateinit var bubble: ImageView
              private lateinit var blp: WindowManager.LayoutParams
              private var panel: LinearLayout? = null
              private var log: LinearLayout? = null
              private var scroll: ScrollView? = null
              private var input: EditText? = null
              private var tts: TextToSpeech? = null
              private var rec: SpeechRecognizer? = null
              private val h = Handler(Looper.getMainLooper())
              private lateinit var idle: Array<Drawable>
              private lateinit var talk: Array<Drawable>
              private var n = 0
              private var pending = 0
              private var busy = false
              private var started = false
              private val cyan = Color.parseColor("#3DE8E0")
          
              override fun onBind(i: Intent?): IBinder? = null
              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun dr(i: Int): Drawable = resources.getDrawable(resources.getIdentifier("f" + "%02d".format(i), "drawable", packageName), null)
          
              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("capri", "Capri", NotificationManager.IMPORTANCE_LOW))
                  val stop = PendingIntent.getService(this, 0, Intent(this, OverlayService::class.java).setAction("stop"), PendingIntent.FLAG_IMMUTABLE)
                  val nt = Notification.Builder(this, "capri").setContentTitle("Capri is linked").setContentText("Tap Stop to hide her")
                      .setSmallIcon(R.drawable.f00).addAction(Notification.Action.Builder(0, "Stop", stop).build()).build()
                  if (Build.VERSION.SDK_INT >= 34) startForeground(1, nt, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE) else startForeground(1, nt)
                  if (i?.action == "stop") { stopSelf(); return START_NOT_STICKY }
                  if (!started) { started = true; setup() }
                  return START_STICKY
              }
          
              private fun setup() {
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  idle = Array(13) { dr(it) }; talk = arrayOf(dr(38), dr(39), dr(0), dr(3))
                  bubble = ImageView(this); bubble.scaleType = ImageView.ScaleType.FIT_CENTER
                  blp = WindowManager.LayoutParams(dp(110), dp(100), WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS, PixelFormat.TRANSLUCENT)
                  blp.gravity = Gravity.TOP or Gravity.START; blp.x = dp(8); blp.y = dp(300)
                  var sx = 0f; var sy = 0f; var ox = 0; var oy = 0; var moved = false
                  bubble.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { sx = e.rawX; sy = e.rawY; ox = blp.x; oy = blp.y; moved = false }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = e.rawX - sx; val dy = e.rawY - sy
                              if (Math.abs(dx) + Math.abs(dy) > dp(8)) moved = true
                              if (moved) { blp.x = ox + dx.toInt(); blp.y = oy + dy.toInt(); if (Math.abs(dx) > dp(8)) bubble.scaleX = if (dx < 0) -1f else 1f; wm.updateViewLayout(bubble, blp) }
                          }
                          MotionEvent.ACTION_UP -> if (!moved) toggle()
                      }
                      true
                  }
                  wm.addView(bubble, blp)
                  tts = TextToSpeech(this) { s -> if (s == TextToSpeech.SUCCESS) pick() }
                  tick()
              }
          
              private fun tick() {
                  n++
                  bubble.setImageDrawable(if (pending > 0 || busy) talk[(n / 2) % talk.size] else idle[(n / 4) % idle.size])
                  h.postDelayed({ tick() }, 83)
              }
          
              private fun pick() {
                  val t = tts ?: return
                  val v = t.voices?.filter { it.locale.language == "en" && !it.features.contains("notInstalled") }
                      ?.maxByOrNull { it.quality * 10 + (if (it.locale.country == "US") 15 else 0) + (if (it.isNetworkConnectionRequired) 5 else 0) }
                  if (v != null) t.voice = v
                  t.setPitch(1.3f); t.setSpeechRate(1.15f)
                  t.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(id: String?) {}
                      override fun onDone(id: String?) { h.post { if (pending > 0) pending-- } }
                      override fun onError(id: String?) { h.post { if (pending > 0) pending-- } }
                  })
              }
          
              private fun speak(text: String) {
                  if (!Api.p(this).getBoolean("speak", true)) return
                  val t = tts ?: return
                  t.stop(); pending = 0
                  val clean = text.replace(Regex("[*#`_~>]"), "")
                  val parts = Regex("[^.!?\\n]+[.!?]*").findAll(clean).map { it.value.trim() }.filter { it.isNotEmpty() }.toList()
                  val chunks = ArrayList<String>(); var buf = StringBuilder()
                  for (s in parts) { if (buf.length + s.length > 400) { chunks.add(buf.toString()); buf = StringBuilder() }; buf.append(s).append(' ') }
                  if (buf.isNotEmpty()) chunks.add(buf.toString())
                  pending = chunks.size
                  chunks.forEachIndexed { i, c -> t.speak(c, TextToSpeech.QUEUE_ADD, null, "u" + i) }
              }
          
              private fun btn(t: String, f: () -> Unit) = Button(this).apply {
                  text = t; textSize = 12f; setTextColor(cyan); setBackgroundColor(Color.TRANSPARENT); minWidth = 0; minimumWidth = 0; setOnClickListener { f() }
              }
          
              private fun msg(me: Boolean, text: String): TextView {
                  val t = TextView(this); t.text = text; t.textSize = 15f; t.setTextColor(if (me) cyan else Color.WHITE); t.setTextIsSelectable(true)
                  t.background = GradientDrawable().apply {
                      setColor(Color.parseColor(if (me) "#1A3DE8E0" else "#59141F")); setStroke(dp(1), if (me) cyan else Color.parseColor("#8F2A3A")); cornerRadius = dp(3).toFloat()
                  }
                  t.setPadding(dp(10), dp(6), dp(10), dp(6))
                  val lp = LinearLayout.LayoutParams(-2, -2)
                  lp.setMargins(if (me) dp(40) else 0, dp(4), if (me) 0 else dp(40), dp(4)); lp.gravity = if (me) Gravity.END else Gravity.START
                  log?.addView(t, lp); scroll?.post { scroll?.fullScroll(View.FOCUS_DOWN) }
                  return t
              }
          
              private fun toggle() { if (panel == null) open() else close() }
          
              private fun open() {
                  val root = LinearLayout(this); root.orientation = LinearLayout.VERTICAL
                  root.background = GradientDrawable().apply { setColor(Color.parseColor("#F2140A0E")); setStroke(dp(2), Color.parseColor("#FF4560")); cornerRadius = dp(6).toFloat() }
                  root.setPadding(dp(10), dp(8), dp(10), dp(8))
                  val head = LinearLayout(this); head.gravity = Gravity.CENTER_VERTICAL
                  head.addView(TextView(this).apply { text = "CAPRI"; setTextColor(cyan); textSize = 16f; typeface = Typeface.DEFAULT_BOLD }, LinearLayout.LayoutParams(0, -2, 1f))
                  head.addView(btn("CLEAR") { Api.p(this).edit().remove("hist").apply(); log?.removeAllViews(); msg(false, "Memory wiped. Fresh start, choom.") })
                  head.addView(btn("X") { close() })
                  log = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  scroll = ScrollView(this).apply { addView(log) }
                  input = EditText(this).apply {
                      hint = "Message Capri"; setTextColor(Color.WHITE); setHintTextColor(Color.GRAY); setSingleLine(); imeOptions = EditorInfo.IME_ACTION_SEND
                      setOnEditorActionListener { _, _, _ -> send(); true }
                  }
                  val row = LinearLayout(this); row.gravity = Gravity.CENTER_VERTICAL
                  row.addView(input, LinearLayout.LayoutParams(0, -2, 1f)); row.addView(btn("MIC") { mic() }); row.addView(btn("SEND") { send() })
                  root.addView(head); root.addView(scroll, LinearLayout.LayoutParams(-1, 0, 1f)); root.addView(row)
                  val lp = WindowManager.LayoutParams(-1, (resources.displayMetrics.heightPixels * 0.6).toInt(), WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL, PixelFormat.TRANSLUCENT)
                  lp.gravity = Gravity.BOTTOM; lp.softInputMode = WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE
                  wm.addView(root, lp); panel = root
                  wm.removeView(bubble); wm.addView(bubble, blp)
                  val hist = JSONArray(Api.p(this).getString("hist", "[]"))
                  for (i in maxOf(0, hist.length() - 10) until hist.length()) { val o = hist.getJSONObject(i); msg(o.getString("role") == "user", o.getString("content")) }
                  if (hist.length() == 0) msg(false, "Hey choom. I'm Capri. Ask me anything.")
              }
          
              private fun close() {
                  panel?.let { try { wm.removeView(it) } catch (e: Exception) {} }
                  panel = null; tts?.stop(); pending = 0; rec?.destroy(); rec = null
              }
          
              private fun send() {
                  val t = input?.text.toString().trim(); if (t.isEmpty() || busy) return
                  input?.setText(""); tts?.stop(); pending = 0
                  msg(true, t); val el = msg(false, "..."); busy = true
                  Thread {
                      val r = try { Api.chat(this, t) } catch (e: Exception) { "Signal dropped. Try again." }
                      h.post { busy = false; el.text = r; scroll?.post { scroll?.fullScroll(View.FOCUS_DOWN) }; speak(r) }
                  }.start()
              }
          
              private fun mic() {
                  if (checkSelfPermission("android.permission.RECORD_AUDIO") != 0) { msg(false, "Open the Capri app once and allow the microphone."); return }
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) { msg(false, "Voice input isn't available on this phone."); return }
                  tts?.stop(); pending = 0; rec?.destroy()
                  val r = SpeechRecognizer.createSpeechRecognizer(this); rec = r
                  r.setRecognitionListener(object : RecognitionListener {
                      override fun onResults(b: Bundle?) { val x = b?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION); if (!x.isNullOrEmpty()) { input?.setText(x[0]); send() } }
                      override fun onPartialResults(b: Bundle?) { b?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()?.let { input?.setText(it) } }
                      override fun onError(e: Int) { msg(false, "Didn't catch that. Try again.") }
                      override fun onReadyForSpeech(b: Bundle?) {}
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(v: Float) {}
                      override fun onBufferReceived(b: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onEvent(t: Int, b: Bundle?) {}
                  })
                  r.startListening(Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM).putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true))
              }
          
              override fun onDestroy() {
                  close(); h.removeCallbacksAndMessages(null)
                  if (started) try { wm.removeView(bubble) } catch (e: Exception) {}
                  tts?.shutdown(); super.onDestroy()
              }
          }
          EOF
          echo '' | base64 -d > app/src/main/res/drawable-nodpi/f00.png
