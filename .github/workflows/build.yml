          echo '' | base64 -d > app/src/main/res/drawable-nodpi/f02.png
          echo '' | base64 -d > app/src/main/res/drawable-nodpi/f03.png
          echo '' | base64 -d > app/src/main/res/drawable-nodpi/f04.png
          echo '' | base64 -d > app/src/main/res/drawable-nodpi/f05.png
          echo '' | base64 -d > app/src/main/res/drawable-nodpi/f06.png
          echo '' | base64 -d > app/src/main/res/drawable-nodpi/f07.png
          echo '' | base64 -d > app/src/main/res/drawable-nodpi/f08.png
          echo '' | base64 -d > app/src/main/res/drawable-nodpi/f09.png
          echo '' | base64 -d > app/src/main/res/drawable-nodpi/f10.png
          echo '' | base64 -d > app/src/main/res/drawable-nodpi/f11.png
          echo '' | base64 -d > app/src/main/res/drawable-nodpi/f12.png
